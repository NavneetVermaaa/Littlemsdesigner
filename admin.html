<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <style>
        body {
            background: #050505;
            color: white;
            font-family: Inter, sans-serif;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        form {
            max-width: 1400px;
        }

        .form-section {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 24px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 25px;
            color: #60a5fa;
        }

        .preview {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: #111827;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .delete-btn {
            background: #dc2626;
            margin-top: 15px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .preview-table-wrap {
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: #0f172a;
            margin: 20px 0;
        }

        .preview-table-wrap table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        .preview-table-wrap th {
            background: #1e293b;
            color: #94a3b8;
            padding: 10px 12px;
            font-size: 11px;
            font-weight: 600;
            text-align: left;
            letter-spacing: 0.05em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-transform: uppercase;
        }

        .preview-table-wrap td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #c8c6c2;
            font-size: 12px;
            vertical-align: middle;
        }

        .preview-table-wrap .row-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .preview-table-wrap .t-name {
            font-weight: 600;
            color: #e8e6e3;
        }

        .preview-table-wrap tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 900px) {

            .form-grid,
            .form-grid-3 {
                grid-template-columns: 1fr;
            }

            body {
                padding: 20px;
            }

        }

        .rb-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        .rb-table th {
            padding: 12px 10px;
            background: #1e293b;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .rb-table th:last-child {
            text-align: center;
        }

        .rb-table td {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        .rb-table td:last-child {
            text-align: center;
        }

        .rb-input {
            width: 100%;
            padding: 10px 12px;
            font-size: 13px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        .rb-file-input {
            padding: 6px;
            font-size: 12px;
            background: transparent;
            border: none;
            width: auto;
            color: white;
        }

        .rb-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 6px;
            display: block;
        }

        .rb-delete-btn {
            width: auto;
            padding: 8px 14px;
            margin: 0;
            background: #dc2626;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            border: none;
            color: white;
        }

        .rb-add-btn {
            width: auto;
            padding: 12px 24px;
            margin-top: 10px;
            background: #1d4ed8;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: white;
        }

        .rb-empty {
            color: #94a3b8;
            padding: 10px;
        }

        .rb-wrap {
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: #0f172a;
        }
    </style>

</head>

<body>

    <div class="admin-container">

        <div class="top-head">

            <div>
                <h1>Admin Panel</h1>
                <p class="sub">
                    Create and manage content for your website
                </p>
            </div>

        </div>

        <form id="cardForm">

            <!-- BASIC INFO -->

            <div class="form-section">

                <div class="section-title">
                    Basic Information
                </div>

                <div class="form-grid">

                    <input type="text" id="id" placeholder="Enter unique ID">

                    <input type="text" id="name" placeholder="Enter name">

                    <input type="text" id="tag" placeholder="Enter tag">

                    <input type="text" id="cnt" placeholder="Enter count">

                </div>

                <div style="margin-top:20px">

                    <textarea id="desc" placeholder="Enter description"></textarea>

                </div>

                <div style="margin-top:20px">

                    <input type="file" id="imgFile" accept="image/*">

                    <img id="imgPreview" style="
width:220px;
margin-top:20px;
border-radius:16px;
display:none;
">

                </div>

                <div class="form-grid" style="margin-top:20px">

                    <select id="type">

                        <option value="detail">Detail Page</option>

                        <option value="table">Table Page</option>

                    </select>

                    <select id="template">

                        <option value="detail">Detail Layout</option>

                        <option value="table">Table Layout</option>

                        <option value="comparison">Comparison Layout</option>

                        <option value="top10">
                            Top 10 Materials
                        </option>

                        <option value="grid">Simple Grid</option>

                    </select>

                </div>

            </div>

            <!-- DYNAMIC FIELDS -->

            <div class="form-section">

                <div class="section-title">
                    Template Fields
                </div>

                <div id="dynamicFields"></div>

                <div id="tableBuilder" style="display:none;margin-top:30px">

                    <div class="section-title">
                        Dynamic Table Builder
                    </div>

                    <div class="form-grid">

                        <input type="text" id="columnInput" placeholder="Enter column name">

                        <button type="button" id="addColumnBtn">
                            Add Column
                        </button>

                    </div>

                    <div id="columnsPreview" style="
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:20px;
        "></div>

                </div>

                <div id="rowBuilder" style="display:none;margin-top:30px">

                    <div class="section-title">
                        Dynamic Row Builder
                    </div>

                    <div id="rowBuilderContainer"></div>

                    <button type="button" id="addRowBtn" class="rb-add-btn">
                        + Add Row
                    </button>

                </div>

            </div>

            <button type="submit">
                Add Card
            </button>

        </form>

        <!-- PREVIEW -->

        <div class="form-section" style="margin-top:30px">

            <div class="section-title">
                Existing Cards (Preview)
            </div>

            <div class="preview" id="preview"></div>

        </div>

    </div>



    <script>

        const form = document.getElementById('cardForm');

        const preview = document.getElementById('preview');

        const imgFile =
            document.getElementById('imgFile');

        const imgPreview =
            document.getElementById('imgPreview');

        let uploadedImage = '';

        imgFile.addEventListener('change', function () {

            const file = this.files[0];

            if (!file) return;

            const reader =
                new FileReader();

            reader.onload = function (e) {

                uploadedImage =
                    e.target.result;

                imgPreview.src =
                    uploadedImage;

                imgPreview.style.display =
                    'block';
            };

            reader.readAsDataURL(file);

        });

        let cards = JSON.parse(localStorage.getItem('cards')) || [];

        form.addEventListener('submit', function (e) {

            e.preventDefault();

            const card = {

                id: document.getElementById('id').value,

                img: uploadedImage,

                name: document.getElementById('name').value,

                desc: document.getElementById('desc').value,

                tag: document.getElementById('tag').value,

                cnt: document.getElementById('cnt').value,

                template: document.getElementById('template').value,

                type: document.getElementById('type').value,

                material: document.getElementById('material')?.value || '',

                thickness: document.getElementById('thickness')?.value || '',

                brands: document.getElementById('brands')?.value || '',

                pros: document.getElementById('pros')?.value || '',

                cons: document.getElementById('cons')?.value || '',

                columns:
                    document.getElementById('columns')?.value || '',

                rows:
                    document.getElementById('rows')?.value || '',

                top10Columns:
                    document.getElementById('template').value === 'top10'
                        ? JSON.stringify(dynamicColumns) : '',

                top10Data:
                    document.getElementById('template').value === 'top10'
                        ? JSON.stringify(dynamicRows) : ''

            };

            cards.push(card);

            localStorage.setItem('cards', JSON.stringify(cards));

            renderCards();

            form.reset();

        });

        function renderCards() {

            preview.innerHTML = cards.map(card => {

                if (card.template === 'top10') {
                    const cols = JSON.parse(card.top10Columns || '[]');
                    const rows = JSON.parse(card.top10Data || '[]');
                    let tableHtml = `<div style="margin-bottom:20px">
                        <h3 style="margin:0 0 6px">${card.name}</h3>
                        <small style="color:#94a3b8">${card.desc}</small>
                    </div>
                    <div class="preview-table-wrap"><table><thead><tr>`;
                    tableHtml += '<th>Image</th><th>Title</th>';
                    cols.forEach(c => { tableHtml += `<th>${c}</th>`; });
                    tableHtml += '<th>Action</th></tr></thead><tbody>';
                    rows.forEach((row, i) => {
                        tableHtml += '<tr>';
                        tableHtml += `<td>${row.image ? `<img src="${row.image}" class="row-img">` : '<span style="color:#666">—</span>'}</td>`;
                        tableHtml += `<td class="t-name">${row.title || '—'}</td>`;
                        cols.forEach(c => {
                            tableHtml += `<td>${(row.fields && row.fields[c]) || '—'}</td>`;
                        });
                        tableHtml += `<td>
                            <button type="button" onclick="editCard('${card.id}')" style="width:auto;padding:6px 12px;margin:0 4px 0 0;background:#2563eb;border-radius:6px;font-size:11px">Edit</button>
                            <button type="button" onclick="deleteCard('${card.id}')" style="width:auto;padding:6px 12px;margin:0;background:#dc2626;border-radius:6px;font-size:11px">Delete</button>
                        </td></tr>`;
                    });
                    tableHtml += '</tbody></table></div>';
                    return tableHtml;
                }

                return `

        <div class="card">

          <img src="${card.img}" alt="${card.name}">

          <div class="card-body">

            <h3>${card.name}</h3>

            <p>${card.desc}</p>

            <small>${card.cnt}</small>

            <button type="button" onclick="editCard('${card.id}')">
                Edit
            </button>
            <button type="button" onclick="deleteCard('${card.id}')">Delete</button>

          </div>

        </div>

      `;

            }).join('');

        }

        renderCards();

        function deleteCard(id) {
            cards = cards.filter(card => card.id !== id);
            localStorage.setItem('cards', JSON.stringify(cards));
            renderCards();
        }

        function editCard(id) {

            const card =
                cards.find(card => card.id === id);

            if (!card) return;

            document.getElementById('id').value =
                card.id;

            uploadedImage = card.img;

            imgPreview.src = card.img;

            imgPreview.style.display = 'block';

            document.getElementById('name').value =
                card.name;

            document.getElementById('desc').value =
                card.desc;

            document.getElementById('tag').value =
                card.tag;

            document.getElementById('cnt').value =
                card.cnt;

            document.getElementById('type').value =
                card.type;

            document.getElementById('template').value =
                card.template;

            renderDynamicFields();

            if (card.template === 'top10') {
                dynamicColumns = JSON.parse(card.top10Columns || '[]');
                dynamicRows = JSON.parse(card.top10Data || '[]');
                renderColumns();
                renderRowBuilder();
            }

            if (document.getElementById('material')) {
                document.getElementById('material').value =
                    card.material || '';
            }

            if (document.getElementById('thickness')) {
                document.getElementById('thickness').value =
                    card.thickness || '';
            }

            if (document.getElementById('brands')) {
                document.getElementById('brands').value =
                    card.brands || '';
            }

            if (document.getElementById('pros')) {
                document.getElementById('pros').value =
                    card.pros || '';
            }

            if (document.getElementById('cons')) {
                document.getElementById('cons').value =
                    card.cons || '';
            }

            if (document.getElementById('thickness')) {
                document.getElementById('thickness').value =
                    card.thickness || '';
            }

            if (document.getElementById('brands')) {
                document.getElementById('brands').value =
                    card.brands || '';
            }

            if (document.getElementById('pros')) {
                document.getElementById('pros').value =
                    card.pros || '';
            }

            if (document.getElementById('cons')) {
                document.getElementById('cons').value =
                    card.cons || '';
            }

            deleteCard(id);

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

        }

        window.editCard = editCard;
        window.deleteCard = deleteCard;
    </script>

    <script>
        const password = prompt("Enter Admin Password");

        if (password !== "admin1234") {

            document.body.innerHTML = `
        <h1 style="
            color:white;
            text-align:center;
            margin-top:100px;
        ">
            Access Denied
        </h1>
    `;
        }








        const templateSelect = document.getElementById('template');
        const dynamicFields = document.getElementById('dynamicFields');

        templateSelect.addEventListener('change', renderDynamicFields);

        let dynamicColumns = [];
        let dynamicRows = [];
        const rowBuilder = document.getElementById('rowBuilder');
        const addRowBtn = document.getElementById('addRowBtn');

        function renderDynamicFields() {
            const value = templateSelect.value;
            const tableBuilder =
                document.getElementById('tableBuilder');

            if (value === 'detail') {
                tableBuilder.style.display = 'none';
                rowBuilder.style.display = 'none';
                dynamicFields.innerHTML = `
                    <input type="text" id="material" placeholder="Material">
                    <input type="text" id="thickness" placeholder="Thickness">
                    <input type="text" id="brands" placeholder="Brands">
                    <textarea id="pros" placeholder="Pros"></textarea>
                    <textarea id="cons" placeholder="Cons"></textarea>
                `;
            } else if (value === 'table') {
                tableBuilder.style.display = 'block';
                rowBuilder.style.display = 'none';
                dynamicFields.innerHTML = `
                    <textarea id="columns" placeholder="Columns separated by comma"></textarea>
                    <textarea id="rows" placeholder="Rows"></textarea>
                `;
            } else if (value === 'comparison') {
                tableBuilder.style.display = 'none';
                rowBuilder.style.display = 'none';
                dynamicFields.innerHTML = `
                    <input type="text" placeholder="Left Item">
                    <input type="text" placeholder="Right Item">
                `;
            } else if (value === 'top10') {
                tableBuilder.style.display = 'block';
                rowBuilder.style.display = 'block';
                dynamicFields.innerHTML = '';
                renderRowBuilder();
            } else {
                tableBuilder.style.display = 'none';
                rowBuilder.style.display = 'none';
                dynamicFields.innerHTML = '';
            }
        }

        renderDynamicFields();
        const addColumnBtn =
            document.getElementById('addColumnBtn');

        const columnsPreview =
            document.getElementById('columnsPreview');

        addColumnBtn.addEventListener('click', () => {

            const input =
                document.getElementById('columnInput');

            const value =
                input.value.trim();

            if (!value) return;

            dynamicColumns.push(value);

            renderColumns();

            input.value = '';

        });

        function renderColumns() {

            columnsPreview.innerHTML =
                dynamicColumns.map((col, index) => {

                    return `
                <div
                    style="
                        background:#1d4ed8;
                        padding:10px 16px;
                        border-radius:12px;
                        display:flex;
                        align-items:center;
                        gap:10px;
                    "
                >
                    <span>${col}</span>

                    <button
                        type="button"
                        onclick="removeColumn(${index})"
                        style="
                            width:auto;
                            padding:4px 10px;
                            margin:0;
                            background:#dc2626;
                            border-radius:8px;
                        "
                    >
                        ×
                    </button>
                </div>
            `;

                }).join('');

            if (templateSelect.value === 'top10') {
                renderRowBuilder();
            }

        }

        function removeColumn(index) {

            dynamicColumns.splice(index, 1);

            renderColumns();

            if (templateSelect.value === 'top10') {
                renderRowBuilder();
            }

        }

        window.removeColumn =
            removeColumn;

        function renderRowBuilder() {
            const container = document.getElementById('rowBuilderContainer');
            if (!dynamicColumns.length) {
                container.innerHTML = '<div class="rb-empty">Add columns first using the column builder above.</div>';
                return;
            }
            let html = '<div class="rb-wrap"><table class="rb-table"><thead><tr>';
            html += '<th>Image</th>';
            html += '<th>Title</th>';
            dynamicColumns.forEach(col => {
                html += `<th>${col}</th>`;
            });
            html += '<th>Action</th></tr></thead><tbody>';
            dynamicRows.forEach((row, index) => {
                html += '<tr>';
                html += `<td>
                    <input type="file" accept="image/*" class="rb-file-input" onchange="uploadRowImage(${index}, this)">
                    ${row.image ? `<img src="${row.image}" class="rb-img">` : ''}
                </td>`;
                html += `<td>
                    <input type="text" class="rb-input" value="${row.title || ''}" oninput="updateRowTitle(${index}, this.value)">
                </td>`;
                dynamicColumns.forEach((col) => {
                    const val = (row.fields && row.fields[col]) || '';
                    html += `<td>
                        <input type="text" class="rb-input" value="${val}" oninput="updateRowField(${index}, ${dynamicColumns.indexOf(col)}, this.value)">
                    </td>`;
                });
                html += `<td>
                    <button type="button" class="rb-delete-btn" onclick="deleteRow(${index})">Delete</button>
                </td></tr>`;
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function addRow() {
            dynamicRows.push({ image: '', title: '', fields: {} });
            renderRowBuilder();
        }

        function deleteRow(index) {
            dynamicRows.splice(index, 1);
            renderRowBuilder();
        }

        function updateRowTitle(index, value) {
            if (!dynamicRows[index]) return;
            dynamicRows[index].title = value;
        }

        function updateRowField(index, colIndex, value) {
            if (!dynamicRows[index]) return;
            const colName = dynamicColumns[colIndex];
            if (!colName) return;
            if (!dynamicRows[index].fields) dynamicRows[index].fields = {};
            dynamicRows[index].fields[colName] = value;
        }

        function uploadRowImage(index, input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                if (!dynamicRows[index]) return;
                dynamicRows[index].image = e.target.result;
                renderRowBuilder();
            };
            reader.readAsDataURL(file);
        }

        addRowBtn.addEventListener('click', addRow);

        window.addRow = addRow;
        window.deleteRow = deleteRow;
        window.updateRowTitle = updateRowTitle;
        window.updateRowField = updateRowField;
        window.uploadRowImage = uploadRowImage;
        window.renderRowBuilder = renderRowBuilder;
    </script>
</body>

</html>
